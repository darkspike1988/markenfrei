services:
  markenfrei:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markenfrei-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Optionale Variablen (siehe .env.example) aus .env übernehmen, falls vorhanden
    env_file:
      - path: .env
        required: false
