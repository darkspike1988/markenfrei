name: Live-Probe der Quellen

# Fragt jede Quelle mit einem bekannten vergebenen und einem Zufallsnamen ab (scripts/live-probe.ts).
# Schlägt fehl, wenn ein Dienst Endpunkt oder Format ändert und die Quelle still "unbekannt" liefern würde.
# Bewusst nicht Teil der normalen CI: sie hängt vom Netz und von Diensten Dritter ab.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live-Probe
        env:
          MARKENFREI_CONTACT: ${{ vars.MARKENFREI_CONTACT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # shell: bash setzt -eo pipefail. Ohne das gilt nur der Exit-Code von tee (immer 0),
        # und ein Fehler der Probe (Exit-Code 1) ließe den Lauf nie scheitern.
        shell: bash
        run: npm run probe:live -- --json probe-status.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Status als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-status
          path: probe-status.json
          if-no-files-found: warn
          retention-days: 90
      - name: Bei Ausfall ein Issue anlegen oder ergänzen
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Live-Probe fehlgeschlagen"
          body="Die Live-Probe ist fehlgeschlagen (Lauf: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Details stehen im Lauf unter \"Live-Probe\" und im Artefakt \`probe-status\` (je Quelle nur ok/Warnung/Fehler, ohne Namen).

          Dieser Hinweis wird automatisch angelegt; das Issue kann geschlossen werden, sobald die Quelle(n) wieder antworten."
          existing="$(gh issue list --state open --search "in:title ${title}" --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
