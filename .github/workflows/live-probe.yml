name: Live-Probe der Quellen

# Fragt jede Quelle aus STATIC_SOURCES und die Domain-Registries .de, .com und .io mit einem bekannten
# vergebenen und einem Zufallsnamen ab (scripts/live-probe.ts). Ausgenommen sind nur die beiden Quellen
# ohne Netz (known_brands, wikidata_brands); die Ausnahmen stehen in src/lib/probe-canaries.ts.
# Meldet Warnungen, wenn eine Quelle still "unbekannt" liefern würde (Dienst ändert Endpunkt oder Format).
# Schlägt nur fehl bei npm, PyPI und crates.io (Stufe gate) und wenn eine Quelle weder Kanarienname noch Ausnahme hat.
# Bewusst nicht Teil der normalen CI: sie hängt vom Netz und von Diensten Dritter ab.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live-Probe
        env:
          MARKENFREI_CONTACT: ${{ vars.MARKENFREI_CONTACT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # shell: bash setzt -eo pipefail. Ohne das gilt nur der Exit-Code von tee (immer 0),
        # und ein Fehler der Probe (Exit-Code 1) ließe den Lauf nie scheitern.
        shell: bash
        run: npm run probe:live -- --json probe-status.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Status als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-status
          path: probe-status.json
          if-no-files-found: warn
          retention-days: 90
