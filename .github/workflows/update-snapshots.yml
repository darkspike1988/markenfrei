name: Schnappschüsse erneuern

# Erneuert die Schnappschüsse im Repository (RDAP-Endungen, Wikidata-Marken) und spielt
# Änderungen per Pull Request ein. Beide Skripte brauchen Netz und erzwingen ihre eigenen
# Grenzen (Dateigröße, Mindestzahl Einträge); schlagen sie fehl, wird kein PR geöffnet.
# Bewusst nicht Teil der normalen CI.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: RDAP-Endungen erneuern
        continue-on-error: true
        run: npx tsx scripts/update-rdap-tlds.ts
      - name: Wikidata-Marken erneuern
        continue-on-error: true
        env:
          MARKENFREI_CONTACT: ${{ vars.MARKENFREI_CONTACT }}
        run: npx tsx scripts/update-wikidata-brands.ts
      - name: Pull-Request bei Änderungen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Keine Änderungen an den Schnappschüssen."
            exit 0
          fi
          branch="chore/snapshots-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add src/lib/engine/sources/rdap-tlds.json src/lib/engine/sources/wikidata-brands.json
          git commit -m "chore: Schnappschüsse erneuert ($(date +%Y-%m-%d))"
          git push origin "${branch}"
          gh pr create --title "chore: Schnappschüsse erneuert ($(date +%Y-%m-%d))" \
            --body "Automatisch erzeugter Pull Request des wöchentlichen Workflows \`update-snapshots.yml\`: erneuert \`rdap-tlds.json\` (IANA-Bootstrap) und \`wikidata-brands.json\` (Wikidata-Schnappschuss). Beide Skripte erzwingen ihre Grenzen (Dateigröße, Mindestzahl Einträge). Bitte Datum und Anzahl im Dateikopf prüfen." \
            --head "${branch}"
