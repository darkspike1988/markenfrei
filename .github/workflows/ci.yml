name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Test & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build MCP package
        run: npm run build:mcp

      - name: Test MCP package (npm pack, start from unpacked tarball)
        run: npm run test:mcp-package

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright browser
        if: matrix.node == 22
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (UI, axe)
        if: matrix.node == 22
        run: npm run e2e

      - name: Upload Playwright report
        if: failure() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
